##### UnifiedTrader Config #####

# =========================================================
# General
# =========================================================
unifiedTrader.leverage=6
unifiedTrader.leverage.min=1
unifiedTrader.adaptiveLeverage.enabled=true
unifiedTrader.tmonCashParking.enabled=true
unifiedTrader.shortsEnabled=true

# Live candle history window (backtest trims history to the same window)
unifiedTrader.live.hourLookbackDays=60
unifiedTrader.live.minuteLookbackHours=72

# Verbose diagnostic logging (HOLD/DECISION details); trades and errors are always logged
# Default: false (reduce backtest log verbosity). Set to true for debugging.
unifiedTrader.verboseLogging.enabled=false

# Log HOLD reasons (disabled by default to reduce verbosity)
unifiedTrader.logHoldReasons=false
unifiedTrader.logEffectiveBalance=false

# =========================================================
# Global Filters
# =========================================================

# Bad Weather Filter - enabled to reduce noise and drawdown
unifiedTrader.badWeatherFilter.enabled=false
unifiedTrader.badWeatherFilter.lowVolumeThreshold=0.3
unifiedTrader.badWeatherFilter.lowAtrThreshold=0.5
unifiedTrader.badWeatherFilter.minRangePercent=0.003
unifiedTrader.badWeatherFilter.highAtrThreshold=2.5
unifiedTrader.badWeatherFilter.maxSpreadPercent=0.015
unifiedTrader.badWeatherFilter.maxWickRatio=0.5
unifiedTrader.badWeatherFilter.panicVolumeThreshold=4.0
unifiedTrader.badWeatherFilter.minAvgDailyVolume=50000
unifiedTrader.badWeatherFilter.atrSpikeThreshold=3.0

