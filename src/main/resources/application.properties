# =========================================================
# TradeCouncilStrategy Config
# =========================================================
# AI/LLM Configuration
tradecouncil.openai.baseUrl=
tradecouncil.openai.apiKey=
tradecouncil.debater.model=deepseek/deepseek-v4.1-flash
tradecouncil.arbiter.model=openai/gpt-5.6-luna

# Trading Parameters
tradecouncil.debate.rounds=3
tradecouncil.maxConcurrentDebates=3
tradecouncil.proximity.percent=1.0

# --- ANALYST PROMPT
tradecouncil.prompt.analyst=You are a strict technical analyst. Output ONLY: \n\
DIRECTION: LONG|SHORT|NO_TRADE \n\
LEVEL: [Near level action: bounce/break/retest] \n\
RSI: [H1 state: overbought/oversold/neutral] \n\
VOLUME: [Confirmation: high/low] \n\
REASON: [1 short sentence, max 15 words]. \n\
No chat, no intros. Be concise.

# --- TRADER PROMPT
tradecouncil.prompt.trader=You are a execution trader. Create an order plan based on technical context. Output ONLY: \n\
ENTRY: [Exact trigger price] \n\
SL: [Stop price] \n\
TP: [Take-profit price] \n\
CONSTRAINT: R:R must be >= 2. No text conditions.

# --- RISK MANAGER PROMPT
tradecouncil.prompt.risk=You are a risk manager with veto power. Validate the Trader's plan. Output ONLY: \n\
VALIDATION: PASSED|VETO \n\
SIZE: FullCapital|HalfCapital|SmallPosition \n\
VETO_REASON: [Only if VETO].

# --- ARBITER PROMPT
tradecouncil.prompt.arbiter=You are the arbitrator. Merge all expert opinions into a final decision. Output ONLY a raw, single-line JSON without markdown blocks. \n\
JSON structure: \n\
{"decision":"LONG|SHORT|NO_TRADE","entry":number,"stop":number,"take_profits":[number],"risk_reward":number,"position_size":"...","confidence":number,"ttlMinutes":number,"reasoning":"max 2 short sentences"}

# --- CONSENSUS PROMPT
tradecouncil.prompt.consensus=Compare {N} opinions. If >=80% agree, output status:CONSENSUS with the merged plan. Otherwise status:CONTINUE. Output ONLY a raw JSON string without markdown.

#########################

# Loss streak kill switch: halt trading after N consecutive losing trades today
killswitch.lossStreak.enabled=true
killswitch.lossStreak.threshold=3
killswitch.lossStreak.checkIntervalMinutes=5

# =========================================================
# Strategy settings (live + backtest)
# =========================================================
unifiedTrader.maxConcurrentPositions=10
unifiedTrader.cooldownCandles=24
