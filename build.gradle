plugins {
    id 'java'
    id 'application'
}

group 'com.github.shk0da'
version '1.0'

sourceCompatibility = 11

repositories {
    mavenCentral()
}

dependencies {
    implementation 'ru.tinkoff.piapi:java-sdk-core:1.5'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation 'org.jfree:jfreechart:1.0.19'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.4'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

task uberJar(type: Jar) {
    manifest {
        attributes 'Main-Class': 'com.github.shk0da.goldendragon.GoldenDragon'
    }

    from { sourceSets.main.output }
    dependsOn { configurations.runtimeClasspath }
    from {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        configurations.runtimeClasspath.filter { it.name.endsWith("jar") }.collect { zipTree(it) }
    }
}

task dataCollect(type: JavaExec) {
    group = 'data'
    description = 'Collect historical market data for stocks and crypto'
    main = 'com.github.shk0da.goldendragon.strategy.DataCollector'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootDir
}

task runBacktest(type: JavaExec) {
    main = 'com.github.shk0da.goldendragon.backtest.BacktestRunner'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootDir
    jvmArgs '--add-opens', 'java.base/java.time=ALL-UNNAMED'
}

task runStrategy(type: JavaExec) {
    main = 'com.github.shk0da.goldendragon.GoldenDragon'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootDir
    jvmArgs '--add-opens', 'java.base/java.time=ALL-UNNAMED'
    def strategyName = project.findProperty('strategy') ?: 'RegimeAwareStrategy'
    args strategyName
}

task runOrderBookStrategy(type: JavaExec) {
    group = 'strategy'
    description = 'Run OrderBook scalping strategy live (cumulative delta + density analysis)'
    main = 'com.github.shk0da.goldendragon.GoldenDragon'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootDir
    jvmArgs '--add-opens', 'java.base/java.time=ALL-UNNAMED'
    args 'OrderBookScalpStrategy'
}

test {
    useJUnitPlatform()
}
