plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'org.owasp.dependencycheck' version '8.4.2'
}

group 'com.github.shk0da'
version '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'ru.tinkoff.piapi:java-sdk-core:1.5'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation 'org.jfree:jfreechart:1.0.19'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.4'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

task uberJar(type: Jar) {
    group = 'build'
    manifest {
        attributes 'Main-Class': 'com.github.shk0da.goldendragon.GoldenDragon'
    }

    from { sourceSets.main.output }
    dependsOn { configurations.runtimeClasspath }
    from {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        configurations.runtimeClasspath.filter { it.name.endsWith("jar") }.collect { zipTree(it) }
    }
}

task dataCollect(type: JavaExec) {
    group = 'backtest'
    description = 'Collect historical market data for stocks and crypto'
    dependsOn compileTestJava
    main = 'com.github.shk0da.goldendragon.backtest.DataCollector'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootDir
}

task runBacktest(type: JavaExec) {
     group = 'backtest'
     mainClass = 'com.github.shk0da.goldendragon.backtest.BacktestRunner'
     classpath = sourceSets.test.runtimeClasspath
     workingDir = rootDir
     // utf-8 console output so cyrillic survives redirection to a file
     jvmArgs '--add-opens', 'java.base/java.time=ALL-UNNAMED',
             '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
     // Enable verbose logging for backtest via -Pverbose=true
     if (project.hasProperty('verbose')) {
         jvmArgs "-DunifiedTrader.verboseLogging.enabled=${project.getProperty('verbose')}"
     }
 }

task runTrailingOptimizer(type: JavaExec) {
    group = 'backtest'
    description = 'Run trailing stop parameter optimization'
    mainClass = 'com.github.shk0da.goldendragon.backtest.BacktestTrailingOptimizer'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootDir
    jvmArgs '--add-opens', 'java.base/java.time=ALL-UNNAMED',
            '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

task runStrategy(type: JavaExec) {
    group = 'trading'
    mainClass = 'com.github.shk0da.goldendragon.GoldenDragon'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootDir
    // utf-8 console output so cyrillic survives redirection to a file
    jvmArgs '--add-opens', 'java.base/java.time=ALL-UNNAMED',
            '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    def strategyName = project.findProperty('strategy') ?: 'UnifiedStrategy'
    args strategyName
}

task runStrategyAI(type: JavaExec) {
    group = 'trading'
    description = 'Run TradeCouncilStrategy (AI-powered trading with LLM debate system)'
    mainClass = 'com.github.shk0da.goldendragon.GoldenDragon'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootDir
    // utf-8 console output so cyrillic survives redirection to a file
    jvmArgs '--add-opens', 'java.base/java.time=ALL-UNNAMED',
            '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    args 'TradeCouncilStrategy'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            // Overall project coverage - low bar for now, will increase over time
            limit {
                minimum = 0.2
            }
        }
        rule {
            // Ensure critical packages have reasonable coverage
            element = 'CLASS'
            includes = [
                'com.github.shk0da.goldendragon.money.*',
                'com.github.shk0da.goldendragon.strategy.*',
                'com.github.shk0da.goldendragon.service.*',
                'com.github.shk0da.goldendragon.utils.*'
            ]
            excludes = [
                // Large complex classes with many edge cases
                'com.github.shk0da.goldendragon.service.TCSService',
                'com.github.shk0da.goldendragon.service.TCSService.*',
                'com.github.shk0da.goldendragon.service.TradingService',
                'com.github.shk0da.goldendragon.service.TradingService.*',
                'com.github.shk0da.goldendragon.strategy.BaseStrategy',
                'com.github.shk0da.goldendragon.strategy.UnifiedStrategy',
                'com.github.shk0da.goldendragon.strategy.UnifiedStrategy.*',
                'com.github.shk0da.goldendragon.strategy.TradeCouncilStrategy',
                'com.github.shk0da.goldendragon.strategy.StrategyRegistry',
                'com.github.shk0da.goldendragon.strategy.StrategyRegistry.*',
                'com.github.shk0da.goldendragon.money.TmonCashParkingMonitor',
                'com.github.shk0da.goldendragon.money.CashParkingManager',
                'com.github.shk0da.goldendragon.money.PerformanceTracker',
                'com.github.shk0da.goldendragon.money.PerformanceTracker.*',
                'com.github.shk0da.goldendragon.utils.PrintUtils',
                'com.github.shk0da.goldendragon.utils.TickerTypeResolver',
                'com.github.shk0da.goldendragon.utils.CandleFileReader',
                'com.github.shk0da.goldendragon.utils.IndicatorsUtil'
            ]
            limit {
                counter = 'LINE'
                minimum = 0.4
            }
        }
    }
}
