name: CI Build & Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

jobs:
  unit-tests:
    runs-on: ubuntu-20.04
    name: Unit Tests & Coverage
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
      
    - name: Run unit tests with coverage
      run: ./gradlew test jacocoTestReport --no-daemon
      
    - name: Upload coverage report
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: jacoco-report
        path: build/reports/jacoco/test/
        
    - name: Upload test results
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: test-results
        path: build/reports/tests/test/
        
    - name: Upload build reports
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: build-reports
        path: build/reports/

  regression:
    runs-on: ubuntu-20.04
    name: Regression Tests
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run backtest regression
      run: ./gradlew runBacktest --no-daemon
      timeout-minutes: 30
      
    - name: Verify backtest profitability
      run: |
        # Check that backtest produces positive PnL (regression check)
        if [ ! -f images/UnifiedStrategy.png ]; then
          echo "ERROR: Equity chart not generated"
          exit 1
        fi
        echo "✅ Backtest completed successfully"

  security:
    runs-on: ubuntu-20.04
    name: Security Scan
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Run OWASP dependency check
      run: ./gradlew dependencyCheckAnalyze --no-daemon || true
      
    - name: Check for hardcoded secrets
      run: |
        # Check for common secret patterns
        grep -rn "apiKey\|secretKey\|password\|token" src/ --include="*.java" | \
          grep -E "(=|:)\s*[\"'][A-Za-z0-9]{16,}[\"']" || echo "No hardcoded secrets found"
